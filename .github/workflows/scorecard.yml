# This workflow uses actions that are not certified by GitHub. They are provided
# by a third-party and are governed by separate terms of service, privacy
# policy, and support documentation.

name: Scorecard supply-chain security

on:
  # For the Branch-Protection check; only the default branch is supported.
  branch_protection_rule:
  # Keeps the Maintained check fresh and re-evaluates after CodeQL has settled. Weekly is enough:
  # the score signals do not move day to day, and Friday lands just after the Thursday CodeQL run.
  schedule:
    - cron: '24 17 * * 5'
  # Lets a maintainer trigger the first run (and re-runs) by hand from the Actions
  # tab, instead of waiting for the weekly cron - useful to publish the first report.
  workflow_dispatch:
  # NOTE: no 'push' trigger on purpose - running at merge time races the CodeQL
  # scan of the just-merged commit and makes the SAST check read as unchecked.

# Declare default permissions as read only.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    # publish_results only works from the default branch.
    if: github.event.repository.default_branch == github.ref_name
    permissions:
      security-events: write # upload SARIF to the code-scanning dashboard
      id-token: write # publish results to the OpenSSF REST API
      contents: read # read commit history (the SAST evaluation window)
      actions: read # read workflow runs
      checks: read # read CodeQL check runs (the SAST signal)
      pull-requests: read # map merged commits to their PRs
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # A fine-grained PAT enables the Branch-Protection check on a public repo;
          # without it we fall back to the built-in token so the run still publishes.
          # Create the PAT per https://github.com/ossf/scorecard-action#authentication-with-fine-grained-pat-optional
          repo_token: ${{ secrets.SCORECARD_TOKEN || github.token }}
          publish_results: true
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5
      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
